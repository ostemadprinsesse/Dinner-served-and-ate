name: Build and Deploy (Two VMs)

on:
  push:
  pull_request:
    branches: ["main", "database-migration-merge-branch"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: src/backend
        run: npm ci

      - name: Lint backend
        working-directory: src/backend
        run: npm run lint

      - name: Test backend
        working-directory: src/backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: src/frontend
        run: npm run lint

  build-images:
    needs: lint-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      github_owner: ${{ steps.vars.outputs.github_owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        id: vars
        run: |
          echo "github_owner=$(echo \"${{ github.repository_owner }}\" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKER_GITHUB_USERNAME }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push backend/frontend/nginx
        working-directory: src
        run: |
          GITHUB_OWNER="${{ steps.vars.outputs.github_owner }}" \
          docker buildx bake -f docker-compose.prod.yml \
            --set *.platform=linux/amd64 \
            --push

  deploy-backend:
    needs: build-images
    runs-on: ubuntu-latest
    env:
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_HOST_NGINX: ${{ secrets.SSH_HOST_NGINX }}
      BACKEND_PRIVATE_IP: ${{ secrets.BACKEND_PRIVATE_IP }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      CR_PAT: ${{ secrets.CR_PAT }}
      DOCKER_GITHUB_USERNAME: ${{ secrets.DOCKER_GITHUB_USERNAME }}
      GITHUB_OWNER: ${{ needs.build-images.outputs.github_owner }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ssh_key
          chmod 600 ~/.ssh/ssh_key

      - name: Create backend env
        run: |
          cat > .env.backend <<EOF
          GITHUB_OWNER=${GITHUB_OWNER}
          DB_HOST=${DB_HOST}
          DB_PORT=${DB_PORT}
          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASSWORD=${DB_PASSWORD}
          EOF

      - name: Upload backend compose and env via bastion
        run: |
          scp -i ~/.ssh/ssh_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ProxyCommand="ssh -i ~/.ssh/ssh_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p $SSH_USER@$SSH_HOST_NGINX" \
            src/docker-compose.backend.yml "$SSH_USER@$BACKEND_PRIVATE_IP:~/app/docker-compose.backend.yml"

          scp -i ~/.ssh/ssh_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ProxyCommand="ssh -i ~/.ssh/ssh_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p $SSH_USER@$SSH_HOST_NGINX" \
            .env.backend "$SSH_USER@$BACKEND_PRIVATE_IP:~/app/.env.backend"

      - name: Deploy backend on private VM
        run: |
          ssh -i ~/.ssh/ssh_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ProxyCommand="ssh -i ~/.ssh/ssh_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p $SSH_USER@$SSH_HOST_NGINX" \
            "$SSH_USER@$BACKEND_PRIVATE_IP" << EOF
            set -euo pipefail
            cd ~/app
            echo "$CR_PAT" | docker login ghcr.io -u "$DOCKER_GITHUB_USERNAME" --password-stdin
            docker compose --env-file .env.backend -f docker-compose.backend.yml pull
            docker rm -f dinner-served-backend 2>/dev/null || true
            docker compose --env-file .env.backend -f docker-compose.backend.yml up -d
          EOF

      - name: Run database migrations and seeds
        run: |
          ssh -i ~/.ssh/ssh_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ProxyCommand="ssh -i ~/.ssh/ssh_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p $SSH_USER@$SSH_HOST_NGINX" \
            "$SSH_USER@$BACKEND_PRIVATE_IP" << 'EOF'
            set -euo pipefail
            for i in 1 2 3 4 5; do
              docker exec dinner-served-backend npm run migrate:latest && break || sleep 5
            done
            docker exec dinner-served-backend npm run seed:run
          EOF

  deploy-nginx:
    needs: [build-images, deploy-backend]
    runs-on: ubuntu-latest
    env:
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_HOST_NGINX: ${{ secrets.SSH_HOST_NGINX }}
      BACKEND_PRIVATE_IP: ${{ secrets.BACKEND_PRIVATE_IP }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      CR_PAT: ${{ secrets.CR_PAT }}
      DOCKER_GITHUB_USERNAME: ${{ secrets.DOCKER_GITHUB_USERNAME }}
      GITHUB_OWNER: ${{ needs.build-images.outputs.github_owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ssh_key
          chmod 600 ~/.ssh/ssh_key

      - name: Create nginx env
        run: |
          cat > .env.nginx <<EOF
          GITHUB_OWNER=${GITHUB_OWNER}
          BACKEND_PRIVATE_IP=${BACKEND_PRIVATE_IP}
          EOF

      - name: Upload nginx compose and env
        run: |
          scp -i ~/.ssh/ssh_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            src/docker-compose.nginx.yml "$SSH_USER@$SSH_HOST_NGINX:~/app/docker-compose.nginx.yml"
          scp -i ~/.ssh/ssh_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            .env.nginx "$SSH_USER@$SSH_HOST_NGINX:~/app/.env.nginx"

      - name: Deploy nginx and frontend on public VM
        run: |
          ssh -i ~/.ssh/ssh_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$SSH_USER@$SSH_HOST_NGINX" << EOF
            set -euo pipefail
            cd ~/app
            echo "$CR_PAT" | docker login ghcr.io -u "$DOCKER_GITHUB_USERNAME" --password-stdin
            docker compose --env-file .env.nginx -f docker-compose.nginx.yml pull
            docker rm -f dinner-served-nginx dinner-served-frontend 2>/dev/null || true
            sudo systemctl disable --now nginx 2>/dev/null || true
            sudo systemctl disable --now apache2 2>/dev/null || true
            sudo fuser -k 80/tcp 2>/dev/null || true
            docker compose --env-file .env.nginx -f docker-compose.nginx.yml up -d
          EOF

  deploy-monitoring:
    needs: [build-images, deploy-backend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_HOST_NGINX: ${{ secrets.SSH_HOST_NGINX }}
      BACKEND_PRIVATE_IP: ${{ secrets.BACKEND_PRIVATE_IP }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ssh_key
          chmod 600 ~/.ssh/ssh_key

      - name: Generate prometheus config from template
        run: |
          envsubst < monitoring/prometheus.azure.template.yml > monitoring/prometheus.azure.yml

      - name: Upload monitoring files to nginx VM
        run: |
          ssh -i ~/.ssh/ssh_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST_NGINX" 'mkdir -p ~/monitoring'
          tar -czf - \
            monitoring/prometheus.azure.yml \
            monitoring/docker-compose.azure.yml \
            monitoring/grafana \
            | ssh -i ~/.ssh/ssh_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              "$SSH_USER@$SSH_HOST_NGINX" 'tar -xzf - --strip-components=1 -C ~/monitoring'

      - name: Start monitoring stack on nginx VM
        run: |
          ssh -i ~/.ssh/ssh_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST_NGINX" << 'EOF'
            set -euo pipefail
            cd ~/monitoring
            docker compose -f docker-compose.azure.yml pull
            docker compose -f docker-compose.azure.yml down --remove-orphans || true
            docker compose -f docker-compose.azure.yml up -d
          EOF
